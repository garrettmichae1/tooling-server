name: Tooling checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd docs internal)"
      - name: Vet
        run: go vet ./...
      - name: Test and detect races
        run: go test -race ./...
      - name: Fuzz utility calls
        env:
          GOMAXPROCS: '2'
        run: go test ./internal/tools -run '^$' -fuzz '^FuzzToolCalls$' -fuzztime=5s
      - name: Fuzz arithmetic
        env:
          GOMAXPROCS: '2'
        run: go test ./internal/tools -run '^$' -fuzz '^FuzzArithmeticExpression$' -fuzztime=5s
      - name: Fuzz exact linear systems
        env:
          GOMAXPROCS: '2'
        run: go test ./internal/tools -run '^$' -fuzz '^FuzzExactLinearSystem$' -fuzztime=5s
      - name: Build server
        run: go build ./cmd/figureserver
      - name: Fuzz sorting traces
        env:
          GOMAXPROCS: '2'
        run: go test ./internal/tools -run '^$' -fuzz '^FuzzSortingTrace$' -fuzztime=5s
      - name: Fuzz project schedules
        env:
          GOMAXPROCS: '2'
        run: go test ./internal/tools -run '^$' -fuzz '^FuzzProjectSchedule$' -fuzztime=5s

  pocket-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build server
        run: go build -o bin/tooling-server ./cmd/figureserver
      - name: Install browser test dependencies
        run: |
          npm install --prefix .toolchain/ui --no-audit --no-fund playwright@1.62.1
          .toolchain/ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise offline apps in Chromium
        run: node scripts/test-pocket-apps.cjs
