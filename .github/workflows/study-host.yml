name: Study host checks

on:
  push:
    branches: [main, feature/cloudflare-study-host]
  pull_request:

permissions:
  contents: read

jobs:
  isolated-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/study-host
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/study-host/package-lock.json
      - name: Install pinned host dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check host types and admission boundaries
        run: |
          npm run typecheck
          npm test
      - name: Build the pinned nonroot Go image
        working-directory: .
        run: docker build --platform linux/amd64 --provenance=false -t edsger-study-tool:review -f services/study-host/Dockerfile .
      - name: Exercise the actual image and Workers runtime together
        run: npm run check:container

# This workflow has no Cloudflare credential and no deployment step.
